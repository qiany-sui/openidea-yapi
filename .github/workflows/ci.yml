name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Verify vendored ASM
        working-directory: vendor/asm
        run: sha256sum --check SHA256SUMS
      - run: python3 scripts/build-java-helper.py
      - run: python3 tests/java_helper_test.py
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
      - name: Package and check with OpenIDEA 0.1.45
        run: |
          mkdir -p dist
          cp target/wasm32-wasip2/release/openidea_yapi.wasm dist/plugin.wasm
          curl --fail --location --output "$RUNNER_TEMP/openidea-plugin.gz" https://github.com/l0ng-ai/openidea/releases/download/v0.1.45/openidea-plugin-linux-x86_64.gz
          echo '00ad9c6062f60b36efbacf21eefd68a00135f2d4ebb0eded360c10670dc8df8c  '"$RUNNER_TEMP/openidea-plugin.gz" | sha256sum --check
          gzip --decompress "$RUNNER_TEMP/openidea-plugin.gz"
          chmod +x "$RUNNER_TEMP/openidea-plugin"
          "$RUNNER_TEMP/openidea-plugin" check .
          "$RUNNER_TEMP/openidea-plugin" pack . --out dist/nc.yapi-0.2.1.oiplugin
          "$RUNNER_TEMP/openidea-plugin" check dist/nc.yapi-0.2.1.oiplugin
          cd dist
          sha256sum nc.yapi-0.2.1.oiplugin > SHA256SUMS
      - name: Check with OpenIDEA 0.1.50
        run: |
          curl --fail --location --output "$RUNNER_TEMP/openidea-plugin-latest.gz" https://github.com/l0ng-ai/openidea/releases/download/v0.1.50/openidea-plugin-linux-x86_64.gz
          echo '4385ac22d894d77478e4492310dd709d858e99eb70549fa81df5107c4a3bd89f  '"$RUNNER_TEMP/openidea-plugin-latest.gz" | sha256sum --check
          gzip --decompress "$RUNNER_TEMP/openidea-plugin-latest.gz"
          chmod +x "$RUNNER_TEMP/openidea-plugin-latest"
          "$RUNNER_TEMP/openidea-plugin-latest" check dist/nc.yapi-0.2.1.oiplugin
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: |
            dist/nc.yapi-0.2.1.oiplugin
            dist/SHA256SUMS
